# ============================
# AUTHENTICATION
# ============================
allow_anonymous false
password_file /mosquitto/config/password_file

# ============================
# MQTT LISTENERS
# ============================
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ============================
# LOGGING
# ============================
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

log_type error
log_type warning
log_type notice
log_type information
log_type all

log_timestamp true
connection_messages true

# ============================
# STORAGE
# ============================
persistence true
persistence_location /mosquitto/data/