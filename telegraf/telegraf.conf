[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = ""
  omit_hostname = false


# ============================
# OUTPUT: INFLUXDB 1.8
# ============================
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "iot_data"
  username = "admin"
  password = "admin123"


# ============================
# MQTT INPUT
# MQTT normal/flood masuk dari Mosquitto
# Measurement: protocol_metrics
# ============================
[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt_broker:1883"]
  topics = ["sensor/#"]
  qos = 0
  connection_timeout = "30s"

  username = "admin"
  password = "admin123"

  data_format = "json"
  name_override = "protocol_metrics"

  # traffic_type dan src diambil dari payload JSON MQTT
  tag_keys = ["traffic_type", "src"]

  [inputs.mqtt_consumer.tags]
    protocol = "mqtt"
    endpoint = "/sensor/temp"


# ============================
# PROCESSOR UNTUK MQTT
# Tambahkan request_count = 1
# Tambahkan latency_ms = 0 jika belum ada
# ============================
[[processors.starlark]]
  source = '''
def apply(metric):
    if metric.tags.get("protocol") == "mqtt":
        metric.fields["request_count"] = 1

        if "latency_ms" not in metric.fields:
            metric.fields["latency_ms"] = 0.0

    return metric
'''


# ============================
# HTTP LISTENER
# Digunakan oleh gRPC / protokol lain yang kirim line protocol ke Telegraf
# Endpoint di dalam Docker: http://telegraf:8186/write
# ============================
[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths = ["/write"]
  methods = ["POST"]
  data_format = "influx"


# ============================
# SNORT ALERT LOG INPUT
# Membaca alert_fast.txt dari Snort
# Measurement: snort_alerts
# ============================
[[inputs.tail]]
  files = ["/var/log/snort/alert_fast.txt"]

  # PENTING:
  # Gunakan "end" supaya alert lama tidak dibaca ulang saat Telegraf restart
  initial_read_offset = "end"

  watch_method = "poll"
  name_override = "snort_alerts"
  data_format = "grok"

  grok_patterns = [
    '%{MONTHNUM:month}/%{MONTHDAY:day}-%{TIME:alert_time} \[\*\*\] \[%{INT:gid}:%{INT:sid}:%{INT:rev}\] %{GREEDYDATA:msg} \[\*\*\] \[Priority: %{INT:priority}\] \{%{WORD:protocol}\} %{IP:src_ip}:%{INT:src_port} -> %{IP:dst_ip}:%{INT:dst_port}'
  ]