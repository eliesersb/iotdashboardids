syntax = "proto3";

package grpc;

service SensorService {
  rpc SendSensorData (SensorRequest) returns (SensorReply);
}

message SensorRequest {
  string device_id = 1;
  float temperature = 2;
  float humidity = 3;
  int64 timestamp = 4;
}

message SensorReply {
  string status = 1;
  string message = 2;
}